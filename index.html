<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icon-128.png" />
    <title>ide</title>
    <script>
      (() => {
        // An explicit light/dark choice (mirrored to localStorage by the app)
        // wins over the OS preference so a pinned theme paints without a flash;
        // "system" or nothing stored falls back to prefers-color-scheme.
        let stored = null;
        try {
          stored = window.localStorage?.getItem("ide-theme-preference");
        } catch {
          stored = null;
        }
        const prefersDark =
          window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ?? false;
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
        document.documentElement.dataset.ideTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
